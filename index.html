<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Book Library</title>
  <style>
    :root {
      --text-primary: #293c33;
      --text-secondary: #758477;
      --text-muted: #8c9a89;
      --text-light: #a1a99c;
      --text-label: #596c5e;
      --bg-primary: #f7f6f1;
      --bg-secondary: #fff;
      --bg-hover: #f0ede5;
      --bg-input: #f9f8f5;
      --border-color: #e5e7dc;
      --border-light: #dedfd4;
      --border-muted: #dce3da;
      --accent-green: #385b46;
      --accent-green-light: #7d987a;
      --accent-gold: #b3935f;
      --accent-brown: #a7afa1;
      --shadow-primary: #33443820;
      --shadow-secondary: #33443813;
      --dialog-backdrop: #192b20a8;
      --tag-bg: #eef2e9;
      --tag-text: #688268;
      --cover-fallback: #7d8f79;
      --cover-bg: #e7e9dc;
      --link-color: #52775c;
      --focus-color: #6f9474;
    }
    :root.dark {
      --text-primary: #e8ebe8;
      --text-secondary: #b0b8b4;
      --text-muted: #8c9a89;
      --text-light: #707970;
      --text-label: #a0a8a0;
      --bg-primary: #1a1f1d;
      --bg-secondary: #242b28;
      --bg-hover: #2f3632;
      --bg-input: #1f2622;
      --border-color: #3a4037;
      --border-light: #2a3127;
      --border-muted: #353d39;
      --accent-green: #5a7f6f;
      --accent-green-light: #8fb08a;
      --accent-gold: #d4a574;
      --accent-brown: #8a9280;
      --shadow-primary: #00000040;
      --shadow-secondary: #00000030;
      --dialog-backdrop: #000000c0;
      --tag-bg: #2f3c2f;
      --tag-text: #9db59d;
      --cover-fallback: #9db599;
      --cover-bg: #2a3027;
      --link-color: #8fc898;
      --focus-color: #7fab7f;
    }
  </style>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="library" aria-label="Book collection">
      <h2 id="results-count"></h2>
      <div class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">Search books</span><input id="search" type="search" placeholder="Search title, author, or tag..."></label>
        <label class="sort-label">SORT BY <select id="sort"><option value="original">Collection order</option><option value="title">Title A–Z</option><option value="author">Author A–Z</option><option value="recent">Recently finished</option><option value="rating">Highest rated</option></select></label>
        <button type="button" class="icon-button theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
        <button type="button" class="button primary" id="new-book">+ Add book</button>
        <button type="button" class="button secondary" id="download-btn">⬇ Save JSON</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="book-grid" class="book-grid"></div>
    </section>
  </main>
  <dialog id="book-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><div><p class="eyebrow" id="dialog-eyebrow">BOOK DETAILS</p><h2 id="dialog-title"></h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Close">×</button></div>
    <div id="detail-view"></div>
    <form id="edit-form" hidden>
      <div class="form-grid">
        <div class="title-field">
          <label>
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <div>Title</div>
              <div>
                <a id="title-amazon-link" href="#" target="_blank" rel="noopener noreferrer" class="links-help" style="display: none;">Search on Amazon →</a>
              </div>
            </div>
            <input name="title" required></label>
        </div>
        <label>Author <input name="author" required></label>
        <label>Subtitle <input name="subtitle"></label>
        <label>Cover URL <input name="cover" type="url" required></label>
        <label>Series <input name="series_name"></label>
        <label>Series order <input name="series_order" type="number" step="any" required></label>
        <label>Series total (# or ?)<input name="series_total" required></label>
        <label>Pages <input name="pages" type="number" step="1" required></label>
        <label>Rating <input name="rating" type="number" step="any" required></label>
        <div>
          <label>
            <div style="display: flex; gap: 4px;">
              <div>Started</div>
              <div><a href="#" id="set-future-link" style="white-space: nowrap; font-size: 0.95em;">future</a></div>
            </div>
            <input name="start_date" type="date" required>
          </label>  
        </div>
        <label>Finished <input name="end_date" type="date" required></label>
        <label class="full-width">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div>Tags</div> 
            <a id="storygraph-link" href="#" target="_blank" rel="noopener noreferrer" style="display: inline-block; margin-top: 8px;">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" style="width: 16px;height: 16px;margin-bottom:4px;"><rect width="256" height="256" fill="none"/><polyline points="216 104 215.99 40.01 152 40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="136" y1="120" x2="216" y2="40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M184,136v72a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8h72" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
              <!-- search on storygraph -->
            </a>
          </div>
          <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;">
            <div style="display: flex; align-items: flex-start; gap: 8px;">
              <input type="checkbox" id="to-read-checkbox" name="to-read">
              <label for="to-read-checkbox" style="margin: 0; font-weight: normal; font-size: 13px;white-space: nowrap;">to read</label>
            </div>
            <div style="display: flex; align-items: flex-start; gap: 8px;">
              <input type="checkbox" id="currently-reading-checkbox" name="currently-reading">
              <label for="currently-reading-checkbox" style="margin: 0; font-weight: normal; font-size: 13px;white-space: nowrap;">currently reading</label>
            </div>
          </div>
          <textarea name="tags" rows="3"></textarea><small>One tag per line.</small></label>
        <label class="full-width">Description <textarea name="description" rows="4"></textarea></label>
        <label class="full-width">Notes <textarea name="notes" rows="4"></textarea></label>
        <fieldset class="full-width links-editor">
          <legend>Links</legend>
          <p class="links-help">Add a label and URL for each link.</p>
          <a id="amazon-link" href="#" target="_blank" rel="noopener noreferrer" class="links-help" style="display: none;">Search on Amazon →</a>
          <a id="bookshop-link" href="#" target="_blank" rel="noopener noreferrer" class="links-help" style="display: none;">Search on bookshop.org →</a>
          <div id="link-rows"></div>
          <button type="button" class="button secondary" id="add-link">+ Add link</button>
        </fieldset>
      </div>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="button secondary" id="cancel-edit">Cancel</button><button type="submit" class="button primary">Save changes</button></div>
    </form>
  </dialog>
</body>
</html>
